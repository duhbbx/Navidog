name: Desktop builds

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to build
        type: choice
        default: all
        options: [all, linux, windows, macos]

permissions:
  contents: read

concurrency:
  group: desktop-build-${{ github.ref }}-${{ inputs.platform || 'all' }}
  cancel-in-progress: true

jobs:
  macos:
    if: github.event_name != 'workflow_dispatch' || inputs.platform == 'all' || inputs.platform == 'macos'
    name: macOS ${{ matrix.edition }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - edition: Arm
            runner: macos-15
            architectures: arm64
          - edition: Intel
            runner: macos-15-intel
            architectures: x86_64
          - edition: Universal
            runner: macos-15
            architectures: 'arm64;x86_64'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: zulu
          java-version: '25'
      - uses: jurplel/install-qt-action@b344308e4483fc892e0d27b3cd1b173ebdd95f06 # v4.5.0
        with:
          version: '6.8.3'
          modules: qt5compat
      - name: Build and package
        env:
          ARCHITECTURES: ${{ matrix.architectures }}
          EDITION: ${{ matrix.edition }}
          NAVIDOG_BUILD_DIR: build-macos
          NAVIDOG_JOBS: '3'
        run: |
          dependency_args=()
          if [[ "$EDITION" == Universal ]]; then
            # The runner's Homebrew libraries only contain its host architecture.
            dependency_args+=(-DCMAKE_DISABLE_FIND_PACKAGE_PkgConfig=ON
              -DNAVIDOG_WITH_POSTGRES=OFF -DNAVIDOG_WITH_MYSQL=OFF)
          fi
          cmake -S . -B "$NAVIDOG_BUILD_DIR" -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR" -DCMAKE_OSX_ARCHITECTURES="$ARCHITECTURES" \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=12.0 -DBUILD_TESTING=OFF \
            -DNAVIDOG_BUNDLE_HIREDIS=ON -DNAVIDOG_WITH_SQLSERVER=OFF "${dependency_args[@]}"
          ./scripts/package-macos.sh
          IFS=';' read -r -a architectures <<< "$ARCHITECTURES"
          lipo dist/Navidog.app/Contents/MacOS/navidog -verify_arch "${architectures[@]}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Navidog-macOS-${{ matrix.edition }}
          path: |
            dist/*.zip
            dist/*.pkg
            dist/*.tar.gz
            dist/*.tar.gz.sha256
          if-no-files-found: error

  windows:
    if: github.event_name != 'workflow_dispatch' || inputs.platform == 'all' || inputs.platform == 'windows'
    name: Windows ${{ matrix.edition }} x64
    runs-on: ${{ matrix.edition == '11' && 'windows-2025' || 'windows-2022' }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - edition: '7'
            qt: '5.15.2'
            arch: win64_mingw81
            tools: tools_mingw,qt.tools.win64_mingw810
            legacy: true
          - edition: '8'
            qt: '5.15.2'
            arch: win64_mingw81
            tools: tools_mingw,qt.tools.win64_mingw810
            legacy: true
          - edition: '10'
            qt: '6.8.3'
            arch: win64_msvc2022_64
            modules: qt5compat
            legacy: false
          - edition: '11'
            qt: '6.8.3'
            arch: win64_msvc2022_64
            modules: qt5compat
            legacy: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        if: ${{ !matrix.legacy }}
        with:
          distribution: zulu
          java-version: '25'
      - uses: jurplel/install-qt-action@b344308e4483fc892e0d27b3cd1b173ebdd95f06 # v4.5.0
        with:
          version: ${{ matrix.qt }}
          arch: ${{ matrix.arch }}
          tools: ${{ matrix.tools }}
          modules: ${{ matrix.modules }}
      - name: Prepare SQLite amalgamation
        shell: pwsh
        run: |
          $zip = Join-Path $env:RUNNER_TEMP sqlite-amalgamation.zip
          Invoke-WebRequest https://www.sqlite.org/2025/sqlite-amalgamation-3510000.zip -OutFile $zip
          if ((Get-FileHash $zip -Algorithm SHA256).Hash -ne '1caf7116f2910600d04473ad69d37ec538fa62fa36adccd37b5e0e43647c98be') {
            throw 'Unexpected SQLite source archive checksum'
          }
          Expand-Archive $zip $env:RUNNER_TEMP
          "NAVIDOG_SQLITE_SOURCE=$env:RUNNER_TEMP/sqlite-amalgamation-3510000" >> $env:GITHUB_ENV
      - name: Build legacy edition and audit PE imports
        if: matrix.legacy
        shell: pwsh
        env:
          EDITION: ${{ matrix.edition }}
        run: |
          $mingw = Join-Path $env:IQTA_TOOLS mingw810_64
          cmake -S . -B build -G 'MinGW Makefiles' -DCMAKE_BUILD_TYPE=Release `
            "-DCMAKE_C_COMPILER=$mingw/bin/gcc.exe" "-DCMAKE_CXX_COMPILER=$mingw/bin/g++.exe" `
            "-DCMAKE_MAKE_PROGRAM=$mingw/bin/mingw32-make.exe" "-DCMAKE_PREFIX_PATH=$env:QT_ROOT_DIR" `
            "-DNAVIDOG_SQLITE_SOURCE=$env:NAVIDOG_SQLITE_SOURCE" -DNAVIDOG_WIN7=ON `
            "-DNAVIDOG_LEGACY_WINDOWS_VERSION=$env:EDITION" -DBUILD_TESTING=OFF `
            -DNAVIDOG_WITH_ORACLE=OFF -DNAVIDOG_WITH_POSTGRES=OFF -DNAVIDOG_WITH_MYSQL=OFF -DNAVIDOG_WITH_SQLSERVER=OFF
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cmake --build build --target navidog --parallel 3
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          & "$env:pythonLocation/python.exe" scripts/package-windows7.py build/navidog.exe $env:QT_ROOT_DIR $mingw $env:EDITION
      - name: Build and deploy modern edition
        if: '!matrix.legacy'
        shell: pwsh
        env:
          EDITION: ${{ matrix.edition }}
        run: |
          $vswhere = "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe"
          $visualStudio = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -format json |
            ConvertFrom-Json | Select-Object -First 1
          if (-not $visualStudio) { throw 'Visual Studio with C++ tools unavailable' }
          $vsRoot = $visualStudio.installationPath
          $generator = switch ($visualStudio.installationVersion.Split('.')[0]) {
            '17' { 'Visual Studio 17 2022' }
            '18' { 'Visual Studio 18 2026' }
            default { throw "Unsupported Visual Studio version $($visualStudio.installationVersion)" }
          }
          cmake -S . -B build -G $generator -A x64 "-DCMAKE_CXX_FLAGS=/MP3 /EHsc" `
            "-DCMAKE_PREFIX_PATH=$env:QT_ROOT_DIR" "-DNAVIDOG_SQLITE_SOURCE=$env:NAVIDOG_SQLITE_SOURCE" `
            -DBUILD_TESTING=OFF -DNAVIDOG_BUNDLE_HIREDIS=ON
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cmake --build build --config Release --target navidog --parallel 3
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $package = "dist/Navidog-Win$env:EDITION-x64"
          New-Item -ItemType Directory -Path $package -Force | Out-Null
          Copy-Item build/Release/navidog.exe $package
          if (Test-Path 'build/jdbc/navidog-jdbc-bridge.jar') {
            New-Item -ItemType Directory -Path "$package/jdbc" -Force | Out-Null
            Copy-Item build/jdbc/navidog-jdbc-bridge.jar "$package/jdbc"
          }
          if ($env:EDITION -eq '10') {
            & "$env:pythonLocation/python.exe" scripts/package-driver-components.py build dist windows-x86_64
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
          }
          $redist = Get-ChildItem "$vsRoot/VC/Redist/MSVC" -Directory |
            Where-Object { $_.Name -match '^\d+(\.\d+){1,3}$' } |
            Sort-Object { [version]$_.Name } -Descending |
            ForEach-Object {
              Get-ChildItem "$($_.FullName)/x64/Microsoft.VC*.CRT" -Directory -ErrorAction SilentlyContinue
            } |
            ForEach-Object { $_.FullName } |
            Where-Object { Test-Path "$_/vcruntime140.dll" } |
            Select-Object -First 1
          if (-not $redist) { throw 'Official Visual C++ redistributable DLLs unavailable' }
          & "$env:QT_ROOT_DIR/bin/windeployqt.exe" --release --no-compiler-runtime "$package/navidog.exe"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Copy-Item "$redist/*.dll" $package
          Copy-Item LICENSE,NOTICE $package
          $version = (Select-String -Path build/CMakeCache.txt '^CMAKE_PROJECT_VERSION:STATIC=(.+)$').Matches[0].Groups[1].Value
          Compress-Archive "$package/*" "dist/Navidog-$version-Win$env:EDITION-x64-Portable.zip"
      - name: Build and verify installer
        shell: pwsh
        env:
          EDITION: ${{ matrix.edition }}
        run: |
          if ($env:EDITION -in '10','11') {
            & "$env:pythonLocation/python.exe" scripts/check-windows-startup.py "dist/Navidog-Win$env:EDITION-x64/navidog.exe"
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
          }
          choco install nsis --version 3.11 --yes --no-progress
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $compiler = "${env:ProgramFiles(x86)}/NSIS/makensis.exe"
          & "$env:pythonLocation/python.exe" scripts/package-windows-setup.py $env:EDITION $compiler
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $version = (Select-String -Path build/CMakeCache.txt '^CMAKE_PROJECT_VERSION:STATIC=(.+)$').Matches[0].Groups[1].Value
          $output = Join-Path (Resolve-Path dist).Path "Navidog-$version-Win$env:EDITION-x64-Setup.exe"
          $testDir = Join-Path $env:RUNNER_TEMP NavidogInstallCheck
          $setup = Start-Process $output -ArgumentList '/S', "/D=$testDir" -Wait -PassThru
          if ($setup.ExitCode -or -not (Test-Path "$testDir/application/navidog.exe")) { throw 'Installer smoke test failed' }
          & "$env:pythonLocation/python.exe" scripts/check-windows-startup.py "$testDir/application/navidog.exe"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $uninstall = Start-Process "$testDir/Uninstall.exe" /S -Wait -PassThru
          if ($uninstall.ExitCode -or (Test-Path "$testDir/application/navidog.exe")) { throw 'Uninstaller smoke test failed' }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Navidog-Win${{ matrix.edition }}-x64
          path: |
            dist/*.zip
            dist/*.zip.sha256
            dist/*.exe
            dist/*.tar.gz
            dist/*.tar.gz.sha256
          if-no-files-found: error

  linux:
    if: github.event_name != 'workflow_dispatch' || inputs.platform == 'all' || inputs.platform == 'linux'
    name: Linux ${{ matrix.edition }} x64
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - edition: ubuntu
            image: ubuntu:24.04
          - edition: debian
            image: debian:13
          - edition: archlinux
            image: archlinux:base-devel
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: zulu
          java-version: '25'
      - name: Build and test in target distribution
        env:
          IMAGE: ${{ matrix.image }}
          EDITION: ${{ matrix.edition }}
        run: |
          docker run --rm -e EDITION -e JAVA_HOME=/opt/navidog-jdk --mount "type=bind,src=$JAVA_HOME,dst=/opt/navidog-jdk,readonly" --mount "type=bind,src=$PWD,dst=/src" "$IMAGE" bash -ec '
            if [[ "$EDITION" == archlinux ]]; then
              pacman -Syu --noconfirm --needed cmake ninja python qt6-base qt6-5compat sqlite openssl postgresql-libs mariadb-libs libssh2 unixodbc ca-certificates hiredis
            else
              export DEBIAN_FRONTEND=noninteractive
              apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=20 update
              apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=20 install -y --no-install-recommends build-essential cmake ninja-build python3 pkg-config ca-certificates qt6-base-dev qt6-qpa-plugins qt6-5compat-dev libsqlite3-dev libssl-dev libpq-dev default-libmysqlclient-dev libhiredis-dev libssh2-1-dev unixodbc-dev dpkg-dev file
            fi
            /src/scripts/build-linux.sh "$EDITION" -DNAVIDOG_BUNDLE_HIREDIS=ON
          '
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Navidog-${{ matrix.edition }}-x64
          path: |
            dist/${{ matrix.edition }}/*.deb
            dist/${{ matrix.edition }}/*.pkg.tar.zst
            dist/${{ matrix.edition }}/*.tar.gz
            dist/${{ matrix.edition }}/*.tar.gz.sha256
          if-no-files-found: error
